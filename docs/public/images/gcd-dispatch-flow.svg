<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">GCD 调度流程：队列 → 线程池 → 线程</text>
  <text x="100" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7280">提交任务</text>
  <rect x="50" y="90" width="100" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="100" y="110" text-anchor="middle" font-size="12" fill="#1e40af">Task 1</text>
  <rect x="50" y="130" width="100" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="100" y="150" text-anchor="middle" font-size="12" fill="#1e40af">Task 2</text>
  <rect x="50" y="170" width="100" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="100" y="190" text-anchor="middle" font-size="12" fill="#1e40af">Task 3</text>
  <path d="M 150,130 L 230,130" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a1)"/>
  <text x="330" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7280">队列（FIFO 排列）</text>
  <rect x="240" y="85" width="180" height="40" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="330" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">串行队列 (width=1)</text>
  <rect x="240" y="140" width="180" height="40" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="330" y="165" text-anchor="middle" font-size="12" font-weight="600" fill="#7c3aed">并发队列 (width=4094)</text>
  <rect x="240" y="195" width="180" height="40" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="330" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">主队列 (主线程)</text>
  <path d="M 420,130 L 500,130" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a1)"/>
  <text x="460" y="122" text-anchor="middle" font-size="11" fill="#2563eb">调度</text>
  <text x="600" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7280">线程池 (上限 64 线程)</text>
  <rect x="510" y="85" width="180" height="180" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" stroke-dasharray="6,3"/>
  <rect x="530" y="95" width="140" height="26" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="600" y="113" text-anchor="middle" font-size="11" fill="#166534">Thread 1</text>
  <rect x="530" y="127" width="140" height="26" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="600" y="145" text-anchor="middle" font-size="11" fill="#166534">Thread 2</text>
  <rect x="530" y="159" width="140" height="26" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="600" y="177" text-anchor="middle" font-size="11" fill="#166534">Thread 3</text>
  <rect x="530" y="191" width="140" height="26" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="600" y="209" text-anchor="middle" font-size="11" fill="#166534">Thread N</text>
  <text x="600" y="241" text-anchor="middle" font-size="14" fill="#6b7280">...</text>
  <path d="M 690,175 L 770,175" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a1)"/>
  <text x="730" y="167" text-anchor="middle" font-size="11" fill="#2563eb">执行</text>
  <text x="860" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7280">CPU 执行</text>
  <rect x="780" y="100" width="160" height="150" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="860" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#c2410c">CPU Cores</text>
  <rect x="810" y="150" width="60" height="30" rx="6" fill="#fed7aa" stroke="#fdba74" stroke-width="1"/>
  <text x="840" y="170" text-anchor="middle" font-size="10" fill="#9a3412">Core 1</text>
  <rect x="890" y="150" width="60" height="30" rx="6" fill="#fed7aa" stroke="#fdba74" stroke-width="1"/>
  <text x="920" y="170" text-anchor="middle" font-size="10" fill="#9a3412">Core 2</text>
  <rect x="810" y="195" width="60" height="30" rx="6" fill="#fed7aa" stroke="#fdba74" stroke-width="1"/>
  <text x="840" y="215" text-anchor="middle" font-size="10" fill="#9a3412">Core 3</text>
  <rect x="890" y="195" width="60" height="30" rx="6" fill="#fed7aa" stroke="#fdba74" stroke-width="1"/>
  <text x="920" y="215" text-anchor="middle" font-size="10" fill="#9a3412">Core 4</text>
  <rect x="30" y="300" width="900" height="80" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="480" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">线程数限制（三层）</text>
  <text x="200" y="355" text-anchor="middle" font-size="12" fill="#6b7280">队列 Width: 串行 1 / 并发 4094</text>
  <text x="500" y="355" text-anchor="middle" font-size="12" fill="#6b7280">Non-overcommit: CPU 核心数</text>
  <text x="780" y="355" text-anchor="middle" font-size="12" fill="#6b7280">XNU 内核硬上限: 64 线程</text>
  <line x1="350" y1="335" x2="350" y2="365" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="640" y1="335" x2="640" y2="365" stroke="#e5e7eb" stroke-width="1"/>
</svg>