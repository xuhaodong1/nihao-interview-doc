<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <defs>
    <marker id="ad" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">GCD 死锁：主队列 sync</text>
  <rect x="60" y="50" width="840" height="300" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <rect x="100" y="80" width="340" height="240" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="270" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">主线程正在执行</text>
  <text x="120" y="130" font-size="12" fill="#374151" font-family="monospace">1. NSLog(@"before");</text>
  <text x="120" y="160" font-size="12" fill="#dc2626" font-family="monospace">2. dispatch_sync(mainQueue, ^{</text>
  <text x="120" y="185" font-size="12" fill="#dc2626" font-family="monospace">      NSLog(@"block");</text>
  <text x="120" y="205" font-size="12" fill="#dc2626" font-family="monospace">   });</text>
  <text x="120" y="230" font-size="12" fill="#9ca3af" font-family="monospace">3. NSLog(@"after");  // 永远到不了</text>
  <text x="270" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">sync 阻塞主线程</text>
  <text x="270" y="290" text-anchor="middle" font-size="12" fill="#dc2626">等待 block 执行完才返回</text>
  <rect x="520" y="80" width="340" height="240" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
  <text x="690" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">主队列（等待中）</text>
  <rect x="550" y="130" width="280" height="40" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="690" y="155" text-anchor="middle" font-size="12" fill="#6b7280">... 当前正在执行的任务（上面的代码）</text>
  <rect x="550" y="185" width="280" height="40" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="690" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">block（排在队列末尾等待）</text>
  <text x="690" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">block 等主线程空闲</text>
  <text x="690" y="280" text-anchor="middle" font-size="12" fill="#dc2626">但主线程在等 block 完成</text>
  <path d="M 440,180 Q 480,140 520,180" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#ad)"/>
  <path d="M 520,220 Q 480,260 440,220" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#ad)"/>
  <rect x="460" y="190" width="40" height="20" rx="4" fill="#dc2626"/>
  <text x="480" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="white">死锁</text>
  <text x="480" y="375" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">结论：永远不要在串行队列的任务中，对同一个串行队列 sync 提交新任务</text>
</svg>