<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">weak 引用生命周期</text>
  <text x="240" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#2563eb">注册流程</text>
  <rect x="80" y="90" width="320" height="55" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="240" y="122" text-anchor="middle" font-size="13" fill="#1e40af">__weak id weakObj = obj;</text>
  <line x1="240" y1="145" x2="240" y2="165" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="80" y="170" width="320" height="55" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="240" y="202" text-anchor="middle" font-size="13" fill="#1e40af">编译器调用 objc_initWeak</text>
  <line x1="240" y1="225" x2="240" y2="245" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="80" y="250" width="320" height="55" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="240" y="274" text-anchor="middle" font-size="13" fill="#1e40af">在 Side Table 的 weak_table 中</text>
  <text x="240" y="292" text-anchor="middle" font-size="13" fill="#1e40af">注册 weakObj 地址</text>
  <line x1="240" y1="305" x2="240" y2="335" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="80" y="340" width="320" height="55" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="240" y="372" text-anchor="middle" font-size="13" fill="#1e40af">设置 isa.weakly_referenced = 1</text>
  <circle cx="68" cy="117" r="12" fill="#2563eb"/>
  <text x="68" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="white">1</text>
  <circle cx="68" cy="197" r="12" fill="#2563eb"/>
  <text x="68" y="202" text-anchor="middle" font-size="12" font-weight="600" fill="white">2</text>
  <circle cx="68" cy="277" r="12" fill="#2563eb"/>
  <text x="68" y="282" text-anchor="middle" font-size="12" font-weight="600" fill="white">3</text>
  <circle cx="68" cy="367" r="12" fill="#2563eb"/>
  <text x="68" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="white">4</text>
  <text x="720" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#dc2626">清理流程（对象释放时）</text>
  <rect x="560" y="90" width="320" height="55" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="720" y="122" text-anchor="middle" font-size="13" fill="#991b1b">引用计数降到 0，触发 dealloc</text>
  <line x1="720" y1="145" x2="720" y2="165" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="560" y="170" width="320" height="55" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="720" y="202" text-anchor="middle" font-size="13" fill="#991b1b">dealloc → clearDeallocating</text>
  <line x1="720" y1="225" x2="720" y2="245" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="560" y="250" width="320" height="55" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="720" y="274" text-anchor="middle" font-size="13" fill="#991b1b">遍历 weak_table 中所有</text>
  <text x="720" y="292" text-anchor="middle" font-size="13" fill="#991b1b">指向该对象的 weak 指针</text>
  <line x1="720" y1="305" x2="720" y2="335" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="560" y="340" width="320" height="55" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="720" y="364" text-anchor="middle" font-size="13" fill="#991b1b">将所有 weak 指针置为 nil</text>
  <text x="720" y="382" text-anchor="middle" font-size="13" fill="#991b1b">从表中移除条目</text>
  <circle cx="548" cy="117" r="12" fill="#dc2626"/>
  <text x="548" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="white">1</text>
  <circle cx="548" cy="197" r="12" fill="#dc2626"/>
  <text x="548" y="202" text-anchor="middle" font-size="12" font-weight="600" fill="white">2</text>
  <circle cx="548" cy="277" r="12" fill="#dc2626"/>
  <text x="548" y="282" text-anchor="middle" font-size="12" font-weight="600" fill="white">3</text>
  <circle cx="548" cy="367" r="12" fill="#dc2626"/>
  <text x="548" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="white">4</text>
  <line x1="480" y1="80" x2="480" y2="410" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="6,4"/>
  <rect x="80" y="420" width="800" height="55" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="480" y="445" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Side Table 结构：spinlock_t slock + RefcountMap refcnts + weak_table_t weak_table</text>
  <text x="480" y="463" text-anchor="middle" font-size="12" fill="#6b7280">全局共 64 个 Side Table，通过对象地址 hash 定位</text>
</svg>