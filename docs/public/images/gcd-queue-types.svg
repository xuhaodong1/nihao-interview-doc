<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">GCD 队列类型对比</text>
  <text x="180.0" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">串行队列 (width = 1)</text>
  <rect x="40" y="80" width="280" height="80" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="65.0" y="95" width="70" height="30" rx="4" fill="#3b82f6"/>
  <text x="100.0" y="115" text-anchor="middle" font-size="11" fill="white" font-weight="600">Task 1</text>
  <rect x="145.0" y="95" width="70" height="30" rx="4" fill="#60a5fa"/>
  <text x="180.0" y="115" text-anchor="middle" font-size="11" fill="white" font-weight="600">Task 2</text>
  <rect x="225.0" y="95" width="70" height="30" rx="4" fill="#93c5fd"/>
  <text x="260.0" y="115" text-anchor="middle" font-size="11" fill="white" font-weight="600">Task 3</text>
  <text x="180.0" y="150" text-anchor="middle" font-size="12" fill="#6b7280">顺序执行，一个接一个</text>
  <line x1="40" y1="180" x2="320" y2="180" stroke="#d1d5db" stroke-width="1"/>
  <text x="180.0" y="260" text-anchor="middle" font-size="11" fill="#9ca3af">时间 →</text>
  <rect x="45" y="190" width="75" height="22" rx="3" fill="#3b82f6"/>
  <text x="82.5" y="205" text-anchor="middle" font-size="10" fill="white">Task 1</text>
  <rect x="124" y="190" width="75" height="22" rx="3" fill="#60a5fa"/>
  <text x="161.5" y="205" text-anchor="middle" font-size="10" fill="white">Task 2</text>
  <rect x="203" y="190" width="75" height="22" rx="3" fill="#93c5fd"/>
  <text x="240.5" y="205" text-anchor="middle" font-size="10" fill="white">Task 3</text>
  <text x="122" y="230" text-anchor="middle" font-size="10" fill="#9ca3af">→</text>
  <text x="201" y="230" text-anchor="middle" font-size="10" fill="#9ca3af">→</text>
  <text x="180.0" y="235" text-anchor="middle" font-size="11" fill="#1e40af">一个完成后才执行下一个</text>
  <text x="490.0" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#7c3aed">并发队列 (width = 4094)</text>
  <rect x="350" y="80" width="280" height="80" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <rect x="375.0" y="95" width="70" height="30" rx="4" fill="#8b5cf6"/>
  <text x="410.0" y="115" text-anchor="middle" font-size="11" fill="white" font-weight="600">Task 1</text>
  <rect x="455.0" y="95" width="70" height="30" rx="4" fill="#a78bfa"/>
  <text x="490.0" y="115" text-anchor="middle" font-size="11" fill="white" font-weight="600">Task 2</text>
  <rect x="535.0" y="95" width="70" height="30" rx="4" fill="#c4b5fd"/>
  <text x="570.0" y="115" text-anchor="middle" font-size="11" fill="white" font-weight="600">Task 3</text>
  <text x="490.0" y="150" text-anchor="middle" font-size="12" fill="#6b7280">同时执行，互不等待</text>
  <line x1="350" y1="180" x2="630" y2="180" stroke="#d1d5db" stroke-width="1"/>
  <text x="490.0" y="260" text-anchor="middle" font-size="11" fill="#9ca3af">时间 →</text>
  <rect x="360" y="188" width="100" height="14" rx="3" fill="#8b5cf6"/>
  <text x="410.0" y="199" text-anchor="middle" font-size="9" fill="white">Task 1</text>
  <rect x="345" y="206" width="80" height="14" rx="3" fill="#a78bfa"/>
  <text x="385.0" y="217" text-anchor="middle" font-size="9" fill="white">Task 2</text>
  <rect x="370" y="224" width="120" height="14" rx="3" fill="#c4b5fd"/>
  <text x="430.0" y="235" text-anchor="middle" font-size="9" fill="white">Task 3</text>
  <text x="490.0" y="235" text-anchor="middle" font-size="11" fill="#7c3aed">多个任务同时执行</text>
  <text x="800.0" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">主队列 (主线程串行)</text>
  <rect x="660" y="80" width="280" height="80" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="685.0" y="95" width="70" height="30" rx="4" fill="#ef4444"/>
  <text x="720.0" y="115" text-anchor="middle" font-size="11" fill="white" font-weight="600">UI 刷新</text>
  <rect x="765.0" y="95" width="70" height="30" rx="4" fill="#f87171"/>
  <text x="800.0" y="115" text-anchor="middle" font-size="11" fill="white" font-weight="600">动画</text>
  <rect x="845.0" y="95" width="70" height="30" rx="4" fill="#fca5a5"/>
  <text x="880.0" y="115" text-anchor="middle" font-size="11" fill="white" font-weight="600">事件</text>
  <text x="800.0" y="150" text-anchor="middle" font-size="12" fill="#6b7280">主线程串行，UI 操作必须在此</text>
  <line x1="660" y1="180" x2="940" y2="180" stroke="#d1d5db" stroke-width="1"/>
  <text x="800.0" y="260" text-anchor="middle" font-size="11" fill="#9ca3af">时间 →</text>
  <rect x="665" y="190" width="75" height="22" rx="3" fill="#ef4444"/>
  <text x="702.5" y="205" text-anchor="middle" font-size="10" fill="white">UI 刷新</text>
  <rect x="744" y="190" width="75" height="22" rx="3" fill="#f87171"/>
  <text x="781.5" y="205" text-anchor="middle" font-size="10" fill="white">动画</text>
  <rect x="823" y="190" width="75" height="22" rx="3" fill="#fca5a5"/>
  <text x="860.5" y="205" text-anchor="middle" font-size="10" fill="white">事件</text>
  <text x="800.0" y="235" text-anchor="middle" font-size="11" fill="#dc2626">固定在主线程顺序执行</text>
  <rect x="40" y="300" width="880" height="100" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="480" y="325" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">sync vs async</text>
  <rect x="70" y="340" width="390" height="45" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="265" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#c2410c">sync（同步）</text>
  <text x="265" y="377" text-anchor="middle" font-size="12" fill="#6b7280">阻塞当前线程，等待任务完成，不开新线程</text>
  <rect x="500" y="340" width="390" height="45" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="695" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">async（异步）</text>
  <text x="695" y="377" text-anchor="middle" font-size="12" fill="#6b7280">不阻塞当前线程，立即返回，可能开新线程</text>
  <line x1="490" y1="340" x2="490" y2="385" stroke="#e5e7eb" stroke-width="1"/>
</svg>