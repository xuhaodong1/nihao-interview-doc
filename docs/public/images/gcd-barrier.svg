<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">dispatch_barrier 读写分离</text>
  <line x1="40" y1="80" x2="920" y2="80" stroke="#d1d5db" stroke-width="1"/>
  <text x="480" y="70" text-anchor="middle" font-size="12" fill="#6b7280">时间轴 →</text>
  <rect x="50" y="100" width="120" height="40" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="110" y="125" text-anchor="middle" font-size="12" fill="#166534" font-weight="600">Read 1</text>
  <rect x="50" y="145" width="100" height="40" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="100" y="170" text-anchor="middle" font-size="12" fill="#166534" font-weight="600">Read 2</text>
  <rect x="50" y="190" width="80" height="40" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="90" y="215" text-anchor="middle" font-size="12" fill="#166534" font-weight="600">Read 3</text>
  <text x="110" y="245" text-anchor="middle" font-size="11" fill="#16a34a">并发读取</text>
  <line x1="200" y1="85" x2="200" y2="280" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="220" y="100" width="180" height="130" rx="4" fill="#fecaca" stroke="#f87171" stroke-width="1.5"/>
  <text x="310" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">Barrier Write</text>
  <text x="310" y="185" text-anchor="middle" font-size="11" fill="#dc2626">独占执行</text>
  <text x="310" y="205" text-anchor="middle" font-size="11" fill="#dc2626">（等前面读完，后面的读等写完）</text>
  <line x1="420" y1="85" x2="420" y2="280" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="440" y="100" width="140" height="40" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="510" y="125" text-anchor="middle" font-size="12" fill="#166534" font-weight="600">Read 4</text>
  <rect x="440" y="145" width="110" height="40" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="495" y="170" text-anchor="middle" font-size="12" fill="#166534" font-weight="600">Read 5</text>
  <text x="490" y="245" text-anchor="middle" font-size="11" fill="#16a34a">并发读取</text>
  <line x1="600" y1="85" x2="600" y2="280" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="620" y="100" width="130" height="130" rx="4" fill="#fecaca" stroke="#f87171" stroke-width="1.5"/>
  <text x="685" y="175" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">Barrier Write</text>
  <line x1="770" y1="85" x2="770" y2="280" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="790" y="100" width="130" height="40" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="855" y="125" text-anchor="middle" font-size="12" fill="#166534" font-weight="600">Read 6</text>
  <rect x="250" y="295" width="20" height="14" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="280" y="307" font-size="12" fill="#6b7280">读操作（dispatch_sync，可并发）</text>
  <rect x="530" y="295" width="20" height="14" rx="2" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <text x="560" y="307" font-size="12" fill="#6b7280">写操作（dispatch_barrier_async，独占）</text>
</svg>