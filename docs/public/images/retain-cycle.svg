<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <defs>
    <marker id="arrow-strong" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-weak" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">循环引用三大场景</text>
  <text x="160" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">1. delegate 循环引用</text>
  <rect x="40" y="90" width="120" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="100" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">ViewController</text>
  <rect x="200" y="90" width="120" height="50" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="260" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">Downloader</text>
  <path d="M 160,105 L 195,105" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-strong)"/>
  <rect x="165" y="93" width="30" height="14" rx="2" fill="white" opacity="0.9"/>
  <text x="180" y="104" text-anchor="middle" font-size="10" fill="#dc2626">strong</text>
  <path d="M 200,130 L 165,130" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-strong)" stroke-dasharray="5,3"/>
  <rect x="162" y="133" width="48" height="14" rx="2" fill="white" opacity="0.9"/>
  <text x="186" y="144" text-anchor="middle" font-size="10" fill="#dc2626">delegate ❌</text>
  <text x="160" y="190" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="600">✅ 修复：delegate 改用 weak</text>
  <rect x="40" y="200" width="120" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="100" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">ViewController</text>
  <rect x="200" y="200" width="120" height="50" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="260" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">Downloader</text>
  <path d="M 160,215 L 195,215" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-strong)"/>
  <rect x="165" y="203" width="30" height="14" rx="2" fill="white" opacity="0.9"/>
  <text x="180" y="214" text-anchor="middle" font-size="10" fill="#dc2626">strong</text>
  <path d="M 200,240 L 165,240" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow-weak)" stroke-dasharray="5,3"/>
  <rect x="162" y="243" width="48" height="14" rx="2" fill="white" opacity="0.9"/>
  <text x="186" y="254" text-anchor="middle" font-size="10" fill="#16a34a">delegate ✅</text>
  <text x="500" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">2. 闭包捕获 self</text>
  <rect x="380" y="90" width="120" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="440" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">self (VC)</text>
  <rect x="540" y="90" width="120" height="50" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="600" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#c2410c">closure</text>
  <path d="M 500,105 L 535,105" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-strong)"/>
  <rect x="503" y="93" width="30" height="14" rx="2" fill="white" opacity="0.9"/>
  <text x="518" y="104" text-anchor="middle" font-size="10" fill="#dc2626">strong</text>
  <path d="M 540,130 L 505,130" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-strong)" stroke-dasharray="5,3"/>
  <rect x="500" y="133" width="50" height="14" rx="2" fill="white" opacity="0.9"/>
  <text x="525" y="144" text-anchor="middle" font-size="10" fill="#dc2626">捕获 self ❌</text>
  <text x="500" y="190" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="600">✅ 修复：[weak self] capture list</text>
  <rect x="380" y="200" width="120" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="440" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">self (VC)</text>
  <rect x="540" y="200" width="120" height="50" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="600" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#c2410c">closure</text>
  <path d="M 500,215 L 535,215" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-strong)"/>
  <rect x="503" y="203" width="30" height="14" rx="2" fill="white" opacity="0.9"/>
  <text x="518" y="214" text-anchor="middle" font-size="10" fill="#dc2626">strong</text>
  <path d="M 540,240 L 505,240" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow-weak)" stroke-dasharray="5,3"/>
  <rect x="497" y="243" width="58" height="14" rx="2" fill="white" opacity="0.9"/>
  <text x="526" y="254" text-anchor="middle" font-size="10" fill="#16a34a">[weak self] ✅</text>
  <text x="820" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">3. Timer 强引用</text>
  <rect x="760" y="90" width="120" height="40" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="820" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">RunLoop</text>
  <rect x="760" y="160" width="120" height="40" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="820" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#c2410c">Timer</text>
  <rect x="760" y="230" width="120" height="40" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="820" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">ViewController</text>
  <path d="M 820,130 L 820,155" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-strong)"/>
  <text x="843" y="148" font-size="10" fill="#dc2626">strong</text>
  <path d="M 820,200 L 820,225" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-strong)"/>
  <text x="843" y="218" font-size="10" fill="#dc2626">target ❌</text>
  <path d="M 880,250 Q 920,250 920,180 Q 920,160 880,160" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arrow-strong)" stroke-dasharray="5,3"/>
  <text x="930" y="210" font-size="10" fill="#dc2626">属性</text>
  <rect x="30" y="310" width="900" height="50" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="50" y1="338" x2="80" y2="338" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-strong)"/>
  <text x="90" y="342" font-size="12" fill="#6b7280">strong 引用（实线 = 正常，虚线 = 造成循环）</text>
  <line x1="400" y1="338" x2="430" y2="338" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-weak)"/>
  <text x="440" y="342" font-size="12" fill="#6b7280">weak 引用（打破循环）</text>
  <rect x="30" y="375" width="900" height="40" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="480" y="400" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">核心原则：凡是两个对象互相指，必有一条边是 weak</text>
</svg>